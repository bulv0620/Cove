name: cove

x-server: &server
  image: cove:${COVE_VERSION:-local}
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  environment: &server-env
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for mysql host in apps/server/.env}

services:
  migrate:
    <<: *server
    restart: 'no'
    command: [sh, -c, 'pnpm db:migrate:deploy && pnpm db:seed']

  server:
    <<: *server
    restart: unless-stopped
    environment:
      <<: *server-env
      PORT: '3000'
      WEB_STATIC_ROOT: /app/public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in apps/server/.env}
      AUTH_LOGIN_FAILURE_WINDOW_SECONDS: '${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-600}'
      AUTH_LOGIN_USERNAME_THRESHOLD: '${AUTH_LOGIN_USERNAME_THRESHOLD:-5}'
      AUTH_LOGIN_IP_THRESHOLD: '${AUTH_LOGIN_IP_THRESHOLD:-20}'
      AUTH_LOGIN_BASE_COOLDOWN_SECONDS: '${AUTH_LOGIN_BASE_COOLDOWN_SECONDS:-30}'
      AUTH_LOGIN_MAX_COOLDOWN_SECONDS: '${AUTH_LOGIN_MAX_COOLDOWN_SECONDS:-900}'
      AUTH_LOGIN_RESET_SECONDS: '${AUTH_LOGIN_RESET_SECONDS:-1800}'
      AUTH_LOGIN_RESERVATION_SECONDS: '${AUTH_LOGIN_RESERVATION_SECONDS:-30}'
      AUTH_LOGIN_STATE_RETENTION_HOURS: '${AUTH_LOGIN_STATE_RETENTION_HOURS:-24}'
      AUTH_TRUSTED_PROXY_CIDRS: '${AUTH_TRUSTED_PROXY_CIDRS:-}'
      SMB_ENABLED: '${SMB_ENABLED:-false}'
      SMB_HOST: '${SMB_HOST:-}'
      SMB_PORT: '${SMB_PORT:-445}'
      SMB_SHARE: '${SMB_SHARE:-home}'
      SMB_DOMAIN: '${SMB_DOMAIN:-}'
      SMB_ENCRYPTION_REQUIRED: '${SMB_ENCRYPTION_REQUIRED:-true}'
      SMB_CREDENTIAL_KEY_ID: '${SMB_CREDENTIAL_KEY_ID:-v1}'
      SMB_CREDENTIAL_KEY: '${SMB_CREDENTIAL_KEY:-}'
      SMB_CREDENTIAL_PREVIOUS_KEYS: '${SMB_CREDENTIAL_PREVIOUS_KEYS:-}'
      SMB_CONNECT_TIMEOUT_MS: '${SMB_CONNECT_TIMEOUT_MS:-10000}'
      SMB_IO_IDLE_TIMEOUT_MS: '${SMB_IO_IDLE_TIMEOUT_MS:-60000}'
      FILES_MAX_UPLOAD_BYTES: '${FILES_MAX_UPLOAD_BYTES:-10737418240}'
      FILES_MAX_ACTIVE_PER_USER: '${FILES_MAX_ACTIVE_PER_USER:-2}'
      FILES_MAX_ACTIVE_GLOBAL: '${FILES_MAX_ACTIVE_GLOBAL:-8}'
      FILES_MAX_QUEUED_PER_USER: '${FILES_MAX_QUEUED_PER_USER:-100}'
      FILES_MAX_DIRECTORY_ENTRIES: '${FILES_MAX_DIRECTORY_ENTRIES:-50000}'
      FILES_DIRECTORY_TIMEOUT_MS: '${FILES_DIRECTORY_TIMEOUT_MS:-30000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${WEB_PORT:-8080}:3000'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "Promise.all([fetch('http://127.0.0.1:3000/'),fetch('http://127.0.0.1:3000/api/auth/me')]).then(([home,api])=>process.exit(home.status===200&&(home.headers.get('content-type')||'').includes('text/html')&&api.status===401?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  bootstrap-admin:
    <<: *server
    profiles: [tools]
    restart: 'no'
    environment:
      <<: *server-env
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: [pnpm, db:bootstrap-admin]
    depends_on:
      migrate:
        condition: service_completed_successfully
